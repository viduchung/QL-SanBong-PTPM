# =====================================================================================
# CẤU HÌNH BOOKING SERVICE (PORT 8081)
# Nạp file .env tổng từ thư mục gốc
# =====================================================================================
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.application.name=booking-service

# Cổng chạy ứng dụng (lấy từ .env tổng)
server.port=${BOOKING_SERVICE_PORT:8081}

# Cấu hình kết nối MySQL Database (lấy từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_BOOKING_DB:football_booking_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA & Hibernate (lấy từ .env tổng)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hiển thị thời gian dạng JSON chuỗi ISO chuẩn
spring.jackson.serialization.write-dates-as-timestamps=false

# Cấu hình Xác thực JWT (Buổi thực hành 5 - lấy từ file .env tổng)
jwt.secret=${JWT_SECRET:FootballBookingServiceSecretKeyForJwtAuthentication2026SecureLongString!@#$%^&*()}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
internal.service.key=${INTERNAL_SERVICE_KEY:FootballInternalSecretServiceKey2026}

