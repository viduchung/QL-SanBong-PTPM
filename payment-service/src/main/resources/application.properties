# =====================================================================================
# CẤU HÌNH PAYMENT SERVICE (PORT 8082)
# Nạp file .env tổng từ thư mục gốc
# =====================================================================================
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.application.name=payment-service

# Cổng chạy ứng dụng (lấy từ .env tổng)
server.port=${PAYMENT_SERVICE_PORT:8082}

# Cấu hình kết nối MySQL Database (lấy từ .env tổng)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_PAYMENT_DB:football_payment_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình JPA & Hibernate (lấy từ .env tổng)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Giao tiếp liên dịch vụ (Service-to-Service) lấy từ file .env tổng
booking.service.base-url=${BOOKING_SERVICE_URL:http://localhost:8081}
booking.service.connect-timeout=${BOOKING_SERVICE_CONNECT_TIMEOUT:2000}
booking.service.read-timeout=${BOOKING_SERVICE_READ_TIMEOUT:3000}

# Format thời gian ISO chuẩn
spring.jackson.serialization.write-dates-as-timestamps=false

# Cấu hình khóa bảo mật liên dịch vụ (Service-to-Service Machine Authentication)
internal.service.key=${INTERNAL_SERVICE_KEY:FootballInternalSecretServiceKey2026}

