# ============================================
# Cau hinh Payment Service (Buoi thuc hanh 2)
# ============================================
spring.application.name=payment-service

# Port 8082 de chay song song cung Booking Service (8081)
server.port=8082

# URL goi sang Booking Service (Config-driven, khong hardcode)
booking.service.base-url=http://localhost:8081
booking.service.connect-timeout=2000
booking.service.read-timeout=3000

# Format thoi gian ISO chuan
spring.jackson.serialization.write-dates-as-timestamps=false
